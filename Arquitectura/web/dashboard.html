<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redes Trujillo | Centro de Mando</title>
    <!-- CSS Modular -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <h1>⚡ Redes Trujillo</h1>
            <p>Sistema de Gestión Eléctrica</p>
        </div>
        <div class="status-indicator">
            <span class="dot online" id="server-status"></span>
            <span id="status-text">Conectando...</span>
        </div>
    </header>

    <main class="dashboard-container">
        <!-- El Grid CSS inyectará aquí las tarjetas dinámicamente -->
        <section id="stations-grid" class="grid-layout">
            <div class="loading-state">Obteniendo telemetría de la red...</div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
