<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redes Trujillo | Gateway</title>
    <!-- Solo cargamos el CSS del portal para evitar conflictos -->
    <link rel="stylesheet" href="css/portal.css">
</head>
<body>
    <main class="gateway-container">
        <div class="gateway-card">
            <header class="gateway-header">
                <h1>⚡ Redes Trujillo</h1>
                <p>Seleccione su perfil de acceso</p>
            </header>
            
            <div class="role-grid">
                <button type="button" class="role-option" onclick="accederSistema('OPERADOR')">
                    <div class="role-icon">🏢</div>
                    <h2>Personal Corporativo</h2>
                    <p>Gestión técnica de la red.</p>
                </button>

                <button type="button" class="role-option" onclick="accederSistema('CLIENTE')">
                    <div class="role-icon">🚗</div>
                    <h2>Portal de Clientes</h2>
                    <p>Reserva de puntos de carga.</p>
                </button>
            </div>
        </div>
    </main>

    <script>
        function accederSistema(rol) {
            // 1. Guardamos el rol en el navegador
            sessionStorage.setItem('RedesTrujillo_Rol', rol);
            
            // 2. Redirección directa y forzada al archivo del panel
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
